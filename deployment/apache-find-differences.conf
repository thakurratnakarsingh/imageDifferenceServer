# Find Differences API/admin reverse proxy.
# Loaded by Apache at server scope so existing phpMyAdmin and other routes remain unchanged.

ProxyRequests Off
ProxyPreserveHost On

ProxyPass        /health http://127.0.0.1:5000/health
ProxyPassReverse /health http://127.0.0.1:5000/health

ProxyPass        /api/v1 http://127.0.0.1:5000/api/v1
ProxyPassReverse /api/v1 http://127.0.0.1:5000/api/v1

ProxyPass        /admin http://127.0.0.1:5000/admin
ProxyPassReverse /admin http://127.0.0.1:5000/admin

ProxyPass        /uploads http://127.0.0.1:5000/uploads
ProxyPassReverse /uploads http://127.0.0.1:5000/uploads
